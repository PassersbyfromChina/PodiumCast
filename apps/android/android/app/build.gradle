apply plugin: 'com.android.application'

/**
 * PodiumCast Android application module.
 *
 * One Gradle project emits BOTH apps through a `role` product-flavour dimension:
 *
 *   assembleCastRelease   -> PodiumCast-Cast.apk
 *   assembleStageRelease  -> PodiumCast-Stage.apk
 *
 * Cast and Stage share every line of TypeScript; they differ only in applicationId, launcher
 * label and which web bundle is packed into `assets/public`. Using flavours instead of two
 * Gradle projects halves the build time and removes any chance of the two drifting apart.
 */
android {
    namespace = "io.github.passersbyfromchina.podiumcast"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "io.github.passersbyfromchina.podiumcast"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    /**
     * The APKs are signed with a self-signed key generated by scripts/build-android.mjs.
     *
     * This is deliberate and documented in README.md: an unsigned release APK cannot be
     * installed at all, and a Play-Store-grade key must never live in a repository. Android
     * will therefore show the standard "unknown developer" prompt on first install.
     */
    signingConfigs {
        podiumcast {
            def keyFile = file('podiumcast.keystore')
            if (keyFile.exists()) {
                storeFile keyFile
                storePassword "podiumcast"
                keyAlias "podiumcast"
                keyPassword "podiumcast"
            }
        }
    }

    flavorDimensions += "role"
    productFlavors {
        cast {
            dimension "role"
            applicationId "io.github.passersbyfromchina.podiumcast.cast"
            // The role is also baked into the JS bundle; this is only the fallback label.
            resValue "string", "podiumcast_role", "cast"
        }
        stage {
            dimension "role"
            applicationId "io.github.passersbyfromchina.podiumcast.stage"
            resValue "string", "podiumcast_role", "stage"
        }
    }

    /**
     * Each flavour ships its own web bundle. scripts/build-android.mjs writes them here and
     * keeps `src/main/assets/public` empty, so the asset merger never sees a duplicate
     * `public/index.html`.
     */
    sourceSets {
        cast.assets.srcDirs += ['src/cast/assets']
        stage.assets.srcDirs += ['src/stage/assets']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (file('podiumcast.keystore').exists()) {
                signingConfig signingConfigs.podiumcast
            }
        }
        debug {
            if (file('podiumcast.keystore').exists()) {
                signingConfig signingConfigs.podiumcast
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        // The plugins carry Chinese comments and Chinese user-facing strings. Without this,
        // javac uses the platform default (GBK on a Chinese Windows) and mangles them.
        encoding "UTF-8"
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }

    // APK file names are per-flavour so build-android.mjs can pick them up unambiguously.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app-${variant.flavorName}-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The embedded WebSocket server that lets an Android Cast be seen by a Stage.
    // A WebView cannot listen on a TCP port, so this has to be native.
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
