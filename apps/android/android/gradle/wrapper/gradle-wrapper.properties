distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# The distribution is fetched from a mirror because services.gradle.org delivers this 131 MB
# archive at ~25 KB/s on some networks, which turns a two-minute build into a two-hour one.
# `distributionSha256Sum` below is the *official* Gradle checksum, so the mirror cannot
# substitute a different artifact: the wrapper refuses to unpack anything that does not match.
#
# To use the canonical source instead, replace the URL with
#   https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# and keep the checksum as-is.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
